name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node -e "require('./src/app.js')" 2>&1 | head -5
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_32_chars_minimum_!!!
          JWT_REFRESH_SECRET: ci_refresh_secret_different_!!!!!!
          MONGO_URI: mongodb://localhost:27017/ci_test
          ENCRYPTION_KEY: ci_encryption_key_32_bytes_min!!

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ''
