name: Keepalive — Wake Render Server

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://power-plan-backend.onrender.com/health)
          echo "Health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Server returned $STATUS — may be cold-starting"
            # Wait 40s and retry once (cold start takes ~30s)
            sleep 40
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://power-plan-backend.onrender.com/health)
            echo "Retry status: $STATUS2"
          else
            echo "✅ Server is alive"
          fi
